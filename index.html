<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F0ED">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Krypto">
<title>Krypto papirhandel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --papir: #F2F0ED;
    --skifer: #383B46;
    --skifer-2: #6A6E7A;
    --skifer-3: #9A9DA6;
    --sand: #C8B488;
    --sand-mork: #A88F5C;
    --stovbla: #7F95B0;
    --panel: #DDE2E8;
    --hvit: #FFFFFF;
    --linje: #E3DFD8;
    --opp: #4E7D5B;
    --ned: #A4553A;
    --serif: "Playfair Display", Georgia, "Times New Roman", serif;
    --sans: "Jost", "Helvetica Neue", Arial, sans-serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { margin: 0; background: var(--papir); color: var(--skifer); }
  body { font: 400 16px/1.5 var(--sans); font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 20px 48px; }

  /* topp */
  .topp { display: flex; align-items: center; justify-content: space-between; padding: 18px 0 14px; }
  .merke { display: flex; align-items: center; gap: 10px; font: 500 15px/1 var(--sans); letter-spacing: .18em; }
  .merke svg { width: 22px; height: 22px; }
  .status { font-size: 13px; color: var(--skifer-2); text-align: right; line-height: 1.35; }
  .status.gammel { color: var(--ned); }

  /* sammenligningsgraf */
  .graf { background: var(--panel); margin: 0 -20px; padding: 22px 20px 16px; }
  .graf h1 { font: 400 26px/1.2 var(--serif); margin: 0 0 14px; }
  .forklaring { display: flex; flex-wrap: wrap; gap: 6px 18px; margin: 0 0 12px; padding: 0; list-style: none; }
  .forklaring li { display: flex; align-items: center; gap: 7px; font-size: 14px; cursor: pointer; }
  .forklaring i { width: 18px; height: 3px; border-radius: 2px; display: inline-block; }
  .forklaring b { font-weight: 500; }
  .forklaring li.aktiv span { font-weight: 600; }
  svg.kurve { width: 100%; height: 190px; display: block; overflow: visible; }
  svg.kurve text { font: 400 11px var(--sans); fill: var(--skifer-2); }
  .tom-graf { font-size: 14px; color: var(--skifer-2); padding: 40px 0; text-align: center; }

  /* faner */
  nav.faner { display: flex; gap: 26px; border-bottom: 1px solid var(--linje); margin: 22px 0 0; }
  nav.faner button { appearance: none; background: none; border: 0; padding: 12px 0 11px; font: 500 16px var(--sans);
    color: var(--skifer-3); border-bottom: 2px solid transparent; margin-bottom: -1px; cursor: pointer; }
  nav.faner button.aktiv { color: var(--skifer); border-bottom-color: var(--sand); }
  nav.faner button:focus-visible { outline: 2px solid var(--sand-mork); outline-offset: 2px; }

  /* nøkkeltall */
  .hode { padding: 22px 0 6px; }
  .hode .beskr { font-size: 14px; color: var(--skifer-2); margin: 0 0 4px; }
  .belop { font: 400 44px/1.1 var(--serif); letter-spacing: -.01em; }
  .belop small { font: 400 18px var(--sans); color: var(--skifer-2); margin-left: 6px; }
  .endring { font-size: 16px; font-weight: 500; margin-top: 4px; }
  .opp { color: var(--opp); } .ned { color: var(--ned); }
  .tall { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--linje); border: 1px solid var(--linje); margin: 18px 0 0; }
  .tall > div { background: var(--hvit); padding: 14px 16px; }
  .tall .n { font: 400 24px/1.2 var(--serif); }
  .tall .t { font-size: 13px; color: var(--skifer-2); }
  .maaler { height: 4px; background: var(--panel); margin-top: 8px; position: relative; }
  .maaler span { position: absolute; left: 0; top: 0; bottom: 0; background: var(--sand); }

  /* seksjoner */
  section { margin-top: 32px; }
  h2 { font: 400 22px/1.25 var(--serif); margin: 0 0 4px; }
  .under { font-size: 14px; color: var(--skifer-2); margin: 0 0 12px; max-width: 60ch; }
  .liste { background: var(--hvit); border: 1px solid var(--linje); }
  .rad { display: grid; align-items: center; gap: 10px; padding: 11px 16px; border-top: 1px solid var(--linje); font-size: 15px; }
  .rad:first-child { border-top: 0; }
  .rad .navn { font-weight: 600; letter-spacing: .02em; }
  .rad .liten { font-size: 13px; color: var(--skifer-2); }
  .rad .hoyre { text-align: right; }
  .pos { grid-template-columns: 1fr auto auto; }
  .pos .pnl { min-width: 64px; text-align: right; font-weight: 500; }
  .handel { grid-template-columns: auto 1fr auto; }
  .merkelapp { font-size: 12px; font-weight: 600; padding: 2px 8px; border: 1px solid currentColor; }
  .sig { grid-template-columns: 64px 70px 1fr 46px; }
  .sig .beslutning { font-size: 13px; font-weight: 600; }
  .sig .beslutning.kjop { color: var(--opp); } .sig .beslutning.selg { color: var(--ned); } .sig .beslutning.avvent { color: var(--skifer-3); }
  .sig .bar { height: 6px; background: var(--papir); position: relative; }
  .sig .bar::after { content: ""; position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--skifer-3); }
  .sig .bar span { position: absolute; top: 0; bottom: 0; }
  .sig .score { text-align: right; font-size: 14px; }
  .tom { padding: 22px 16px; font-size: 15px; color: var(--skifer-2); }
  .mer { appearance: none; background: none; border: 0; border-top: 1px solid var(--linje); width: 100%; padding: 12px 16px;
    font: 500 14px var(--sans); color: var(--sand-mork); text-align: left; cursor: pointer; }
  footer { margin-top: 36px; padding-top: 16px; border-top: 1px solid var(--linje); font-size: 13px; color: var(--skifer-2); max-width: 62ch; }
</style>
</head>
<body>
<div class="wrap">
  <header class="topp">
    <div class="merke" aria-label="Krypto">
      <svg viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="10" fill="#C8B488"/><path d="M5 14 L9 10 L12 12.5 L17 7" stroke="#383B46" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      KRYPTO
    </div>
    <div class="status" id="status">henter data …</div>
  </header>

  <div class="graf">
    <h1>Utvikling siden start</h1>
    <ul class="forklaring" id="forklaring"></ul>
    <svg class="kurve" id="kurve" viewBox="0 0 340 190" preserveAspectRatio="none" role="img" aria-label="Avkastning i prosent for de tre systemene"></svg>
  </div>

  <nav class="faner" id="faner" aria-label="Velg system"></nav>

  <div class="hode">
    <p class="beskr" id="beskr"></p>
    <div class="belop" id="belop">–</div>
    <div class="endring" id="endring"></div>
  </div>
  <div class="tall" id="tall"></div>

  <section>
    <h2>Posisjoner</h2>
    <p class="under" id="pos-under"></p>
    <div class="liste" id="posisjoner"></div>
  </section>
  <section>
    <h2>Siste handler</h2>
    <div class="liste" id="handler"></div>
  </section>
  <section>
    <h2>Signaler</h2>
    <p class="under" id="sig-under"></p>
    <div class="liste" id="signaler"></div>
  </section>

  <footer>
    Simulert papirhandel med 1 000 USDT i startkapital per system. Ingen ekte penger. Systemene kjøres hver time på GitHub sine servere, ofte 5–30 minutter forsinket. Ikke finansiell rådgivning.
  </footer>
</div>

<script>
  const BASE = "https://raw.githubusercontent.com/bjornandre-jpg/krypto-dashboard/main/state/";
  const SYS = {
    system1:   { navn: "Krypto13",  farge: "#383B46", tak: 60, beskr: "13 faste mynter, daglige candles og seks signalkilder",
                 sig: "Ny vurdering hver time. Kjøp eller salg krever samme signal to timer på rad." },
    krypto50:  { navn: "Krypto50",  farge: "#A88F5C", tak: 80, beskr: "De 50 største myntene etter volum, 4-timers candles",
                 sig: "Ny vurdering hver fjerde time når en candle lukkes. Samme signal to ganger på rad kreves." },
    krypto100: { navn: "Krypto100", farge: "#7F95B0", tak: 80, beskr: "De 100 største myntene etter volum, 4-timers candles",
                 sig: "Ny vurdering hver fjerde time når en candle lukkes. Samme signal to ganger på rad kreves." },
  };
  const NOKKEL = Object.keys(SYS);
  const data = {};
  let valgt = { krypto50: "krypto50", krypto100: "krypto100", system1: "system1", krypto13: "system1" }[location.hash.slice(1)] || "system1";
  let visAlleSignaler = false;

  const nf = (v, d = 0) => v.toLocaleString("nb-NO", { minimumFractionDigits: d, maximumFractionDigits: d });
  const pst = (v, d = 1) => (v > 0 ? "+" : v < 0 ? "−" : "") + nf(Math.abs(v), d) + " %";
  const kurs = v => v >= 100 ? nf(v, 2) : v >= 1 ? nf(v, 3) : v >= 0.01 ? nf(v, 5) : v.toPrecision(3);
  const tick = a => (a || "").split(/[\/-]/)[0];
  const klokke = iso => new Date(iso).toLocaleTimeString("nb-NO", { hour: "2-digit", minute: "2-digit" });
  const siden = iso => { const m = Math.round((Date.now() - new Date(iso)) / 60000);
    return m < 1 ? "akkurat nå" : m < 60 ? `${m} min siden` : m < 1440 ? `${Math.round(m / 60)} t siden` : `${Math.round(m / 1440)} d siden`; };
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  function tegnGraf() {
    const svg = document.getElementById("kurve"), W = 340, H = 190, L = 34, R = 6, T = 8, B = 22;
    const serier = NOKKEL.filter(k => data[k]).map(k => {
      const d = data[k], s = d.start_capital || 1000;
      const pkt = (d.equity_curve || []).map(([t, v]) => [new Date(t).getTime(), (v / s - 1) * 100]);
      pkt.push([new Date(d.updated_at).getTime(), (d.equity_usd / s - 1) * 100]);
      return { k, pkt };
    }).filter(s => s.pkt.length);
    document.getElementById("forklaring").innerHTML = NOKKEL.map(k => {
      const d = data[k]; const r = d ? (d.equity_usd / (d.start_capital || 1000) - 1) * 100 : null;
      return `<li data-k="${k}" class="${k === valgt ? "aktiv" : ""}"><i style="background:${SYS[k].farge}"></i><span>${SYS[k].navn}</span>
        <b class="${r > 0 ? "opp" : r < 0 ? "ned" : ""}">${r == null ? "–" : pst(r, 2)}</b></li>`;
    }).join("");
    document.querySelectorAll("#forklaring li").forEach(li => li.onclick = () => velg(li.dataset.k));
    if (!serier.length) { svg.innerHTML = ""; return; }
    const alle = serier.flatMap(s => s.pkt);
    let t0 = Math.min(...alle.map(p => p[0])), t1 = Math.max(...alle.map(p => p[0]));
    if (t1 - t0 < 3600e3) t0 = t1 - 3600e3;
    let y0 = Math.min(0, ...alle.map(p => p[1])), y1 = Math.max(0, ...alle.map(p => p[1]));
    const pad = Math.max(0.5, (y1 - y0) * 0.12); y0 -= pad; y1 += pad;
    const x = t => L + (t - t0) / (t1 - t0) * (W - L - R), y = v => T + (y1 - v) / (y1 - y0) * (H - T - B);
    const steg = [0.25, 0.5, 1, 2, 5, 10, 20, 50, 100].find(s => (y1 - y0) / s <= 5) || 200;
    let g = "";
    for (let v = Math.ceil(y0 / steg) * steg; v <= y1; v += steg) {
      g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="${v === 0 ? "#6A6E7A" : "#C5CCD5"}" stroke-width="1" ${v === 0 ? "" : 'stroke-dasharray="2 3"'} vector-effect="non-scaling-stroke"/>
            <text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${(v > 0 ? "+" : v < 0 ? "−" : "") + nf(Math.abs(v), steg < 1 ? 2 : 0)}%</text>`;
    }
    const dato = t => new Date(t).toLocaleDateString("nb-NO", { day: "numeric", month: "short" });
    g += `<text x="${L}" y="${H - 4}">${dato(t0)}</text><text x="${W - R}" y="${H - 4}" text-anchor="end">${dato(t1)}</text>`;
    for (const s of [...serier].sort((a, b) => (a.k === valgt) - (b.k === valgt))) {
      const aktiv = s.k === valgt, p = s.pkt.map(([t, v]) => `${x(t).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
      g += `<polyline points="${p}" fill="none" stroke="${SYS[s.k].farge}" stroke-width="${aktiv ? 2.6 : 1.6}"
             stroke-opacity="${aktiv ? 1 : .75}" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>`;
      const [lt, lv] = s.pkt[s.pkt.length - 1];
      g += `<circle cx="${x(lt)}" cy="${y(lv)}" r="${aktiv ? 3.5 : 2.5}" fill="${SYS[s.k].farge}"/>`;
    }
    svg.innerHTML = g;
  }

  function tegnSystem() {
    document.getElementById("faner").innerHTML = NOKKEL.map(k =>
      `<button data-k="${k}" class="${k === valgt ? "aktiv" : ""}" aria-pressed="${k === valgt}">${SYS[k].navn}</button>`).join("");
    document.querySelectorAll("#faner button").forEach(b => b.onclick = () => velg(b.dataset.k));
    const d = data[valgt], S = SYS[valgt];
    document.getElementById("beskr").textContent = S.beskr;
    document.getElementById("sig-under").textContent = S.sig;
    if (!d) { document.getElementById("belop").textContent = "–"; return; }
    const r = (d.equity_usd / (d.start_capital || 1000) - 1) * 100;
    document.getElementById("belop").innerHTML = `${nf(d.equity_usd, 2)}<small>USDT</small>`;
    const e = document.getElementById("endring");
    e.textContent = `${pst(r, 2)} siden start`; e.className = "endring " + (r > 0 ? "opp" : r < 0 ? "ned" : "");
    const eks = d.total_exposure_pct || 0, fg = d.fear_greed_value;
    const fgTekst = fg == null ? "" : fg <= 24 ? "Ekstrem frykt" : fg <= 44 ? "Frykt" : fg <= 55 ? "Nøytral" : fg <= 75 ? "Grådighet" : "Ekstrem grådighet";
    document.getElementById("tall").innerHTML = `
      <div><div class="n">${nf(eks, 0)} %</div><div class="t">investert i krypto, tak ${S.tak} %</div>
        <div class="maaler"><span style="width:${Math.min(100, eks / S.tak * 100)}%"></span></div></div>
      <div><div class="n">${fg ?? "–"}</div><div class="t">Fear &amp; Greed: ${fgTekst}</div>
        <div class="maaler"><span style="width:${fg ?? 0}%"></span></div></div>`;

    const ps = (d.positions || []).slice().sort((a, b) => b.value_usd - a.value_usd);
    document.getElementById("pos-under").textContent = ps.length
      ? `${ps.length} åpne posisjoner, til sammen ${nf(d.positions_value_usd || 0, 0)} USDT. Kontanter ${nf(d.cash_usd, 0)} USDT.` : "";
    document.getElementById("posisjoner").innerHTML = ps.length ? ps.map(p => `
      <div class="rad pos"><div><div class="navn">${esc(tick(p.asset))}</div><div class="liten">kjøpt ${kurs(p.entry_price)}, nå ${kurs(p.current_price)}</div></div>
        <div class="hoyre">${nf(p.value_usd, 0)}</div><div class="pnl ${p.pnl_pct >= 0 ? "opp" : "ned"}">${pst(p.pnl_pct)}</div></div>`).join("")
      : `<div class="tom">Ingen åpne posisjoner. Systemet kjøper når et signal er bekreftet.</div>`;

    const hs = (d.recent_trades || []).slice(0, 10);
    document.getElementById("handler").innerHTML = hs.length ? hs.map(h => `
      <div class="rad handel"><span class="merkelapp ${h.side === "KJØP" ? "opp" : "ned"}">${h.side === "KJØP" ? "Kjøp" : "Salg"}</span>
        <div><span class="navn">${esc(tick(h.mynt))}</span> <span class="liten">${esc(h.grunn)}</span></div>
        <div class="hoyre"><div>${nf(parseFloat(h.belop_usdt), 0)}</div><div class="liten">${siden(h.tid)}</div></div></div>`).join("")
      : `<div class="tom">Ingen handler ennå.</div>`;

    const ss = (d.signals || []).slice().sort((a, b) => (b.score ?? -9) - (a.score ?? -9));
    const vis = visAlleSignaler ? ss : ss.slice(0, 12);
    document.getElementById("signaler").innerHTML = ss.length ? vis.map(s => {
      const sc = Math.max(-1, Math.min(1, s.score ?? 0)), w = Math.abs(sc) * 50;
      const kl = s.decision === "KJØP" ? "kjop" : s.decision === "SELG" ? "selg" : "avvent";
      const tekst = { KJØP: "Kjøp", SELG: "Selg", AVVENT: "Avvent" }[s.decision] || "–";
      return `<div class="rad sig"><span class="navn">${esc(tick(s.asset))}</span>
        <span class="beslutning ${kl}">${tekst}${s.confirmed && s.decision !== "AVVENT" ? " ✓" : ""}</span>
        <div class="bar"><span style="left:${sc >= 0 ? 50 : 50 - w}%;width:${w}%;background:${sc >= 0 ? "var(--opp)" : "var(--ned)"}"></span></div>
        <span class="score">${s.score == null ? "–" : nf(s.score, 2)}</span></div>`;
    }).join("") + (ss.length > 12 ? `<button class="mer" id="mer">${visAlleSignaler ? "Vis færre" : `Vis alle ${ss.length}`}</button>` : "")
      : `<div class="tom">Ingen signaler ennå.</div>`;
    const m = document.getElementById("mer"); if (m) m.onclick = () => { visAlleSignaler = !visAlleSignaler; tegnSystem(); };
  }

  function tegnStatus() {
    const tider = NOKKEL.map(k => data[k]?.updated_at).filter(Boolean).sort();
    const el = document.getElementById("status");
    if (!tider.length) return;
    const siste = tider[tider.length - 1], gammel = Date.now() - new Date(siste) > 150 * 60000;
    el.className = "status" + (gammel ? " gammel" : "");
    el.innerHTML = `oppdatert ${siden(siste)}<br>neste ca. kl. ${klokke(new Date(new Date(siste).getTime() + 3600e3))}`;
  }

  function velg(k) { valgt = k; visAlleSignaler = false; history.replaceState(null, "", "#" + (k === "system1" ? "krypto13" : k)); tegnGraf(); tegnSystem(); }

  async function hent() {
    await Promise.all(NOKKEL.map(async k => {
      try {
        const r = await fetch(BASE + k + "/dashboard.json?t=" + Math.floor(Date.now() / 60000), { cache: "no-store" });
        if (r.ok) data[k] = await r.json();
      } catch (e) { console.error(k, e); }
    }));
    tegnStatus(); tegnGraf(); tegnSystem();
  }
  tegnSystem();
  hent(); setInterval(hent, 2 * 60 * 1000); setInterval(tegnStatus, 30 * 1000);
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") hent(); });
</script>
</body>
</html>

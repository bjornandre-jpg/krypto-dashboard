name: Testordre på Bitvavo (manuell)

on:
  workflow_dispatch:
    inputs:
      marked:
        description: "Marked, f.eks. BTC-EUR"
        default: "BTC-EUR"
        required: true
      belop:
        description: "Beløp i euro (5-50)"
        default: "5"
        required: true
      selg_tilbake:
        description: "Selg tilbake med én gang? ja/nei"
        default: "ja"
        required: true
      bekreft:
        description: 'Skriv JA EKTE ORDRE for å handle på ekte. Alt annet = tørrkjøring'
        default: ""
        required: false

jobs:
  testordre:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Legg testordre
        env:
          BITVAVO_API_KEY: ${{ secrets.BITVAVO_API_KEY }}
          BITVAVO_API_SECRET: ${{ secrets.BITVAVO_API_SECRET }}
          BITVAVO_EKTE: ${{ inputs.bekreft == 'JA EKTE ORDRE' && 'ja' || 'nei' }}
          MARKED: ${{ inputs.marked }}
          BELOP: ${{ inputs.belop }}
          SELG_TILBAKE: ${{ inputs.selg_tilbake }}
        run: python verktoy/testordre.py

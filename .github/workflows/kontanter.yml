name: Bokfør innskudd og uttak (manuell)

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: handel
  cancel-in-progress: false

jobs:
  kontanter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bokfør og avstem
        env:
          BITVAVO_API_KEY: ${{ secrets.BITVAVO_API_KEY }}
          BITVAVO_API_SECRET: ${{ secrets.BITVAVO_API_SECRET }}
        run: python verktoy/kontanter.py
      - name: Lagre
        if: always()
        run: |
          git config user.name "krypto-bot"
          git config user.email "krypto-bot@users.noreply.github.com"
          git add state
          git diff --cached --quiet && exit 0
          git commit -m "Kontantbevegelser $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1

name: Sjekk Bitvavo-konto (manuell)

on:
  workflow_dispatch: {}

jobs:
  sjekk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test avstemmingslogikken (oppdiktede tall, ingen nettverk)
        run: python verktoy/test_avstemming.py
      - name: Les saldo og avstem (legger ingen ordrer)
        env:
          BITVAVO_API_KEY: ${{ secrets.BITVAVO_API_KEY }}
          BITVAVO_API_SECRET: ${{ secrets.BITVAVO_API_SECRET }}
        run: python verktoy/sjekk_konto.py
